[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hypernet-streams"
version = "0.9.0"
description = "Local IPC client for authenticated HyperNet application streams"
requires-python = ">=3.10"
license = {file = "Licence.txt"}

[tool.setuptools]
license-files = ["Licence.txt"]
packages = ["hypernet_streams"]
