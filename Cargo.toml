[package]
name = "hypernet-suite"
version = "0.7.5"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Independent command-line client for HyperNet"

[[bin]]
name = "HyperNetSuite"
path = "Source/Main.rs"

[[test]]
name = "TerminalSafety"
path = "Tests/TerminalSafety.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bech32 = "=0.9.1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize", "pkcs8", "pem"] }
hex = "0.4"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
roxmltree = "=0.21.1"
svgtypes = "=0.16.1"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }

openmls = { version = "=0.9.1", default-features = false }
openmls_traits = { version = "=0.6.0", default-features = false }
openmls_rust_crypto = { version = "=0.6.0", default-features = false }
openmls_basic_credential = { version = "=0.6.0", default-features = false }
tls_codec = "=0.5.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
age = { version = "=0.11.5", default-features = false }
x25519-dalek = { version = "=2.0.1", default-features = false }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
