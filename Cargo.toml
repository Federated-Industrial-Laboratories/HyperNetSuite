[package]
name = "hypernet-suite"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Independent command-line client for HyperNet"

[[bin]]
name = "HyperNetSuite"
path = "Source/Main.rs"

[[test]]
name = "TerminalSafety"
path = "Tests/TerminalSafety.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
